purpose:
  stands_in_for: A generic user-selected RFC 4918 WebDAV server, not a specific cloud provider.
  unblocks: Local validation of the production backup HTTP client without real SMS or credentials.
assumptions:
  - id: webdav-contract
    status: supported
    claim: RFC 4918 defines MKCOL 201, existing-resource 405, and PROPFIND 207 multistatus responses.
    reason: The client follows these protocol responses and verifies an existing collection before upload.
    verification: Reviewed the RFC 4918 contract on 2026-10-30; provider-specific compatibility remains unverified.
    source: https://www.rfc-editor.org/rfc/rfc4918; docs/WEBDAV.md
    updated_at: "2026-10-30"
  - id: provider-auth
    status: unknown
    claim: A user's selected server accepts HTTPS and UTF-8 Basic authentication.
    reason: No specific provider or real credentials were supplied; the fixture implements this assumed configuration.
    verification: No live provider check has been performed.
    source: runtime/src/main/kotlin/io/github/magisk317/smscode/feature/backup/WebDavClient.kt
    updated_at: "2026-10-30"
  - id: client-roundtrip-and-failures
    status: supported
    claim: The production HTTP client completed upload-list-download and propagated 401, 507 and 500 in the local scenarios exercised.
    reason: The real Kotlin client ran against the Postman stand-in; both simulation tests passed and the request log confirmed every dependency path.
    verification: On 2026-10-30 with fingerprint webdav-implementation, WebDavSimulationTest passed 2 tests. The log showed MKCOL 201, PUT 201, PROPFIND 207, GET 200, a second MKCOL 405 followed by Depth 0 PROPFIND and PUT 201, plus 401 authentication, PUT 507 quota failure and GET 500 download failure. WebDavClientTest separately passed 12 local HTTP tests for encoding, paths, redirects, XML, size limits and cleanup. These are local caller results, not live-provider guarantees.
    source: runtime/src/test/kotlin/io/github/magisk317/smscode/feature/backup/WebDavSimulationTest.kt; runtime/src/test/kotlin/io/github/magisk317/smscode/feature/backup/WebDavClientTest.kt; postman/mocks/webdav/default.js
    updated_at: "2026-10-30"
fingerprints:
  - id: webdav-implementation
    date: "2026-10-30"
    commit: 375bb0267b583100a6818fde2e337fcbead519bb (dirty working tree)
    cli: "1.75.0"
